name: One-time activity matrix generation

on:
  push:
    branches: [feat/activity-evaluation-matrix]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/activity-evaluation-matrix
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: dart format bin lib test integration_test
      - name: Export Drift schema v3
        run: dart run drift_dev schema dump lib/data/local/app_database.dart drift_schemas/app_database/
      - name: Commit generated artifacts
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin lib test integration_test drift_schemas
          git commit -m "chore: regenerate schema v3 artifacts"
          git push origin HEAD:feat/activity-evaluation-matrix
