name: One-time analyzer fixes

on:
  push:
    branches: [feat/activity-evaluation-matrix]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/activity-evaluation-matrix
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Apply exact analyzer fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected snippet not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          replace(
              'lib/features/evaluation/presentation/evaluation_controller.dart',
              "          if (activity.roster.isEmpty)\n            option = await _repairEmptyRoster(option);",
              "          if (activity.roster.isEmpty) {\n            option = await _repairEmptyRoster(option);\n          }",
          )

          screen = 'lib/features/evaluation/presentation/evaluation_screen.dart'
          replace(
              screen,
              "import 'package:aularaiz/domain/evaluation/achievement_level.dart';\n",
              "import 'package:aularaiz/domain/evaluation/achievement_level.dart';\nimport 'package:aularaiz/domain/evaluation/activity_evaluation.dart';\n",
          )
          replace(
              screen,
              "    if (row == null)\n      return const SizedBox(width: 48, child: Center(child: Text('—')));",
              "    if (row == null) {\n      return const SizedBox(width: 48, child: Center(child: Text('—')));\n    }",
          )
          replace(
              screen,
              "                if (value != null)\n                  setState(() {\n                    _delivery = value;\n                    if (value != DeliveryStatus.delivered) _achievement = null;\n                  });",
              "                if (value != null) {\n                  setState(() {\n                    _delivery = value;\n                    if (value != DeliveryStatus.delivered) {\n                      _achievement = null;\n                    }\n                  });\n                }",
          )
          replace(
              screen,
              "String _code(dynamic evaluation) {\n  if (evaluation.state == EvaluationState.pendingDeliveryDecision) return 'P';\n  if (evaluation.state == EvaluationState.notDelivered) return 'N';\n  if (evaluation.state == EvaluationState.deliveredAwaitingEvaluation)\n    return 'T';\n  return switch (evaluation.achievement as AchievementLevel?) {",
              "String _code(ActivityEvaluation evaluation) {\n  if (evaluation.state == EvaluationState.pendingDeliveryDecision) {\n    return 'P';\n  }\n  if (evaluation.state == EvaluationState.notDelivered) {\n    return 'N';\n  }\n  if (evaluation.state == EvaluationState.deliveredAwaitingEvaluation) {\n    return 'T';\n  }\n  return switch (evaluation.achievement) {",
          )

          projects = 'lib/features/projects/presentation/projects_screen.dart'
          p = Path(projects)
          text = p.read_text()
          replacements = {
              'ProjectMethodology.problemBased': 'ProjectMethodology.problemBasedLearning',
              'FormativeField.knowledgeScientificThought': 'FormativeField.knowledgeAndScientificThought',
              'ArticulatingAxis.culturesReadingWriting': 'ArticulatingAxis.culturesThroughReadingAndWriting',
              'ArticulatingAxis.artsAestheticExperiences': 'ArticulatingAxis.artsAndAestheticExperiences',
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'Expected enum reference not found: {old}')
              text = text.replace(old, new)
          p.write_text(text)

          report_test = Path('test/application/report_projection_builder_test.dart')
          text = report_test.read_text()
          text = text.replace("      formativeFields: {FormativeField.languages},\n", "")
          report_test.write_text(text)
      - run: flutter pub get
      - run: dart format bin lib test integration_test
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin lib test integration_test
          git commit -m "fix: resolve activity matrix analyzer issues"
          git push origin HEAD:feat/activity-evaluation-matrix
