name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Verify Drift schema snapshot
        run: |
          set -euo pipefail
          schema_dir="$(mktemp -d)"
          dart run drift_dev schema dump lib/data/local/app_database.dart "$schema_dir/"
          diff -u \
            drift_schemas/app_database/drift_schema_v2.json \
            "$schema_dir/drift_schema_v2.json"
      - run: flutter gen-l10n
      - name: Verify Dart formatting
        run: |
          dart format bin lib test integration_test
          git diff --exit-code -- bin lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - name: Validate automation CLI contract
        shell: bash
        run: |
          set -euo pipefail
          dart run bin/aularaiz_agent.dart --help > /tmp/aularaiz-agent-help.json
          python3 - <<'PY'
          import json
          with open('/tmp/aularaiz-agent-help.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert payload['schema'] == 'aularaiz.automation/v1'
          assert payload['kind'] == 'help'
          PY
      - name: Validate standalone automation agent bundle
        shell: bash
        run: |
          set -euo pipefail
          dart build cli --target=bin/aularaiz_agent.dart --output=/tmp/aularaiz-agent-build
          agent=/tmp/aularaiz-agent-build/bundle/bin/aularaiz_agent
          test -x "$agent"
          "$agent" --help > /tmp/aularaiz-agent-bundle-help.json
          python3 - <<'PY'
          import json
          with open('/tmp/aularaiz-agent-bundle-help.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert payload['schema'] == 'aularaiz.automation/v1'
          assert payload['kind'] == 'help'
          PY

  android-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: flutter build apk --debug
      - name: Validate release App Bundle build
        run: flutter build appbundle --release

  windows-build:
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: flutter build windows --release
      - name: Build standalone automation agent bundle
        shell: pwsh
        run: |
          $agentBuild = Join-Path $PWD 'build\automation-agent'
          dart build cli --target=bin/aularaiz_agent.dart --output=$agentBuild
          if ($LASTEXITCODE -ne 0) { throw 'Automation agent bundle build failed.' }

          $bundle = Join-Path $agentBuild 'bundle'
          $destination = Join-Path $PWD 'build\windows\x64\runner\Release\automation'
          if (Test-Path $destination) { Remove-Item $destination -Recurse -Force }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item (Join-Path $bundle '*') $destination -Recurse -Force

          $sourceExe = Join-Path $destination 'bin\aularaiz_agent.exe'
          $agentExe = Join-Path $destination 'bin\aularaiz-agent.exe'
          if (-not (Test-Path $sourceExe)) { throw "Automation executable not found: $sourceExe" }
          Rename-Item $sourceExe 'aularaiz-agent.exe'
          & $agentExe --help | Out-File (Join-Path $env:RUNNER_TEMP 'aularaiz-agent-help.json') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Bundled automation agent failed to start.' }
      - name: Validate Windows installer build
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $versionLine = Get-Content pubspec.yaml |
            Where-Object { $_ -match '^version:' } |
            Select-Object -First 1
          $version = (($versionLine -replace '^version:\s*', '') -split '\+')[0]
          $sourceDir = (Resolve-Path 'build\windows\x64\runner\Release').Path
          $outputDir = Join-Path $PWD 'build\installer-validation'
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$version" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" 'windows\installer\AulaRaiz.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer validation failed.' }
