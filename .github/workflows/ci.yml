name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Verify Drift schema snapshot
        run: |
          set -euo pipefail
          dart run drift_dev schema dump \
            lib/data/local/app_database.dart \
            drift_schemas/app_database/
          git diff --exit-code -- drift_schemas/app_database
          untracked="$(git ls-files --others --exclude-standard drift_schemas/app_database)"
          if [ -n "$untracked" ]; then
            echo "Missing committed Drift snapshot(s):"
            echo "$untracked"
            while IFS= read -r snapshot; do
              [ -z "$snapshot" ] && continue
              echo "--- BEGIN $snapshot ---"
              cat "$snapshot"
              echo "--- END $snapshot ---"
            done <<< "$untracked"
            exit 1
          fi
      - name: Upload Drift snapshots on mismatch
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: drift-schema-snapshots
          path: drift_schemas/app_database/drift_schema_v*.json
          if-no-files-found: ignore
          retention-days: 1
      - run: flutter gen-l10n
      - name: Verify Dart formatting
        run: |
          dart format bin lib test integration_test
          git diff --exit-code -- bin lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - name: Validate automation CLI contract
        shell: bash
        run: |
          set -euo pipefail
          dart run bin/aularaiz_agent.dart --help > /tmp/aularaiz-agent-help.json
          python3 - <<'PY'
          import json
          with open('/tmp/aularaiz-agent-help.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert payload['schema'] == 'aularaiz.automation/v1'
          assert payload['kind'] == 'help'
          commands = {command['name'] for command in payload['data']['commands']}
          assert {'attendance-set', 'student-deactivate', 'student-reactivate'} <= commands
          PY
      - name: Validate update coordinator entrypoint
        shell: bash
        run: dart run bin/aularaiz_updater.dart --help
      - name: Validate standalone automation agent bundle
        shell: bash
        run: |
          set -euo pipefail
          dart build cli --target=bin/aularaiz_agent.dart --output=/tmp/aularaiz-agent-build
          agent=/tmp/aularaiz-agent-build/bundle/bin/aularaiz_agent
          test -x "$agent"
          "$agent" --help > /tmp/aularaiz-agent-bundle-help.json
          python3 - <<'PY'
          import json
          with open('/tmp/aularaiz-agent-bundle-help.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert payload['schema'] == 'aularaiz.automation/v1'
          assert payload['kind'] == 'help'
          commands = {command['name'] for command in payload['data']['commands']}
          assert {'attendance-set', 'student-deactivate', 'student-reactivate'} <= commands
          PY

  android-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: flutter build apk --debug
      - name: Validate release App Bundle build
        run: flutter build appbundle --release

  windows-build:
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: flutter build windows --release
      - name: Build standalone automation agent bundle
        shell: pwsh
        run: |
          $agentBuild = Join-Path $PWD 'build\automation-agent'
          dart build cli --target=bin/aularaiz_agent.dart --output=$agentBuild
          if ($LASTEXITCODE -ne 0) { throw 'Automation agent bundle build failed.' }

          $bundle = Join-Path $agentBuild 'bundle'
          $destination = Join-Path $PWD 'build\windows\x64\runner\Release\automation'
          if (Test-Path $destination) { Remove-Item $destination -Recurse -Force }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item (Join-Path $bundle '*') $destination -Recurse -Force

          $sourceExe = Join-Path $destination 'bin\aularaiz_agent.exe'
          $agentExe = Join-Path $destination 'bin\aularaiz-agent.exe'
          if (-not (Test-Path $sourceExe)) { throw "Automation executable not found: $sourceExe" }
          Rename-Item $sourceExe 'aularaiz-agent.exe'
          Copy-Item 'windows\terminal\aula.cmd' (Join-Path $destination 'bin\aula.cmd') -Force
          Copy-Item 'windows\terminal\aularaiz.cmd' (Join-Path $destination 'bin\aularaiz.cmd') -Force
          if (-not (Test-Path (Join-Path $destination 'bin\aula.cmd'))) { throw 'Terminal command shim not found.' }
          & $agentExe --help | Out-File (Join-Path $env:RUNNER_TEMP 'aularaiz-agent-help.json') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Bundled automation agent failed to start.' }
      - name: Build update coordinator
        shell: pwsh
        run: |
          $updaterBuild = Join-Path $PWD 'build\update-coordinator'
          dart build cli --target=bin/aularaiz_updater.dart --output=$updaterBuild
          if ($LASTEXITCODE -ne 0) { throw 'Update coordinator build failed.' }
          $sourceUpdater = Join-Path $updaterBuild 'bundle\bin\aularaiz_updater.exe'
          $updater = Join-Path $PWD 'build\windows\x64\runner\Release\aularaiz-updater.exe'
          if (-not (Test-Path $sourceUpdater)) { throw "Update coordinator executable not found: $sourceUpdater" }
          Copy-Item $sourceUpdater $updater -Force
          & $updater --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Update coordinator failed to start.' }
      - name: Validate Windows installer build
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $versionLine = Get-Content pubspec.yaml |
            Where-Object { $_ -match '^version:' } |
            Select-Object -First 1
          $version = (($versionLine -replace '^version:\s*', '') -split '\+')[0]
          $sourceDir = (Resolve-Path 'build\windows\x64\runner\Release').Path
          $outputDir = Join-Path $PWD 'build\installer-validation'
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$version" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" 'windows\installer\AulaRaiz.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer validation failed.' }
      - name: Checksum Windows beta installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'build\installer-validation\AulaRaiz-Setup-*.exe' |
            Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows beta installer was not found.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@v6
        with:
          name: windows-beta-installer
          path: |
            build/installer-validation/AulaRaiz-Setup-*.exe
            build/installer-validation/AulaRaiz-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14
