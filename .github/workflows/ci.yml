name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Verify Drift migration artifacts
        run: |
          dart run drift_dev make-migrations
          drift_status="$(git status --porcelain -- drift_schemas test/drift lib/data/local/app_database.steps.dart)"
          if [ -n "$drift_status" ]; then
            echo "::error::Drift migration artifacts are out of date. Run 'dart run drift_dev make-migrations' and commit the generated files."
            printf '%s\n' "$drift_status"
            exit 1
          fi
      - run: flutter gen-l10n
      - name: Verify Dart formatting
        run: |
          dart format lib test integration_test
          git diff --exit-code -- lib test integration_test
      - run: flutter analyze
      - run: flutter test

  android-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: flutter build apk --debug

  windows-build:
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: flutter build windows --release
