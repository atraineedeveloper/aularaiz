name: One-time final formatter

on:
  push:
    branches: [feat/activity-evaluation-matrix]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/activity-evaluation-matrix
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: dart format test/application/student_sex_import_test.dart test/infrastructure/group_export_renderer_test.dart
      - name: Commit formatted tests
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/application/student_sex_import_test.dart test/infrastructure/group_export_renderer_test.dart
          git commit -m "style: format final regression tests"
          git push origin HEAD:feat/activity-evaluation-matrix
