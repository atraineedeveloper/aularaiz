name: One-time Dart format

on:
  push:
    branches: [fix/attendance-evaluation-editing]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/attendance-evaluation-editing
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: dart format bin lib test integration_test
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin lib test integration_test
          git commit -m "style: apply Dart formatting"
          git push origin HEAD:fix/attendance-evaluation-editing
