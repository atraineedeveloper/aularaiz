name: Format PR29

on:
  push:
    branches:
      - feat/group-dashboard-management

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/group-dashboard-management
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Apply Dart formatting
        run: dart format bin lib test integration_test
      - name: Remove temporary workflow
        shell: bash
        run: rm .github/workflows/format-pr29.yml
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format dashboard and management changes"
          git push origin HEAD:feat/group-dashboard-management
