name: Phase 3 Format Once

on:
  push:
    branches:
      - feat/school-management
    paths:
      - .github/workflows/phase3-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/school-management
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Apply Dart formatting
        run: dart format lib test integration_test
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- lib test integration_test; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test integration_test
          git commit -m "style: apply Dart formatting for Phase 3"
          git push origin HEAD:feat/school-management
