name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching pubspec.yaml (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.1'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - id: version
        name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          raw_version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          version="${raw_version%%+*}"
          expected_tag="v${version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must match pubspec version '$expected_tag'."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Verify Drift migration artifacts
        run: |
          dart run drift_dev make-migrations
          drift_status="$(git status --porcelain -- drift_schemas test/drift lib/data/local/app_database.steps.dart)"
          if [ -n "$drift_status" ]; then
            echo "::error::Drift migration artifacts are out of date."
            printf '%s\n' "$drift_status"
            exit 1
          fi
      - run: flutter gen-l10n
      - name: Verify Dart formatting
        run: |
          dart format bin lib test integration_test
          git diff --exit-code -- bin lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - name: Validate automation CLI contract
        shell: bash
        run: |
          set -euo pipefail
          dart run bin/aularaiz_agent.dart --help > /tmp/aularaiz-agent-help.json
          python3 - <<'PY'
          import json
          with open('/tmp/aularaiz-agent-help.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert payload['schema'] == 'aularaiz.automation/v1'
          assert payload['kind'] == 'help'
          PY

  android:
    runs-on: ubuntu-latest
    needs: validate
    env:
      ANDROID_KEYSTORE_PATH: upload-keystore.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Require Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required for a production release."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - name: Build signed Android App Bundle
        run: flutter build appbundle --release
      - name: Name and checksum App Bundle
        shell: bash
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          bundle_dir="build/app/outputs/bundle/release"
          output="AulaRaiz-${APP_VERSION}.aab"
          mv "$bundle_dir/app-release.aab" "$bundle_dir/$output"
          (cd "$bundle_dir" && sha256sum "$output" > "$output.sha256")
          rm -f android/app/upload-keystore.jks
      - uses: actions/upload-artifact@v6
        with:
          name: release-android
          path: |
            build/app/outputs/bundle/release/AulaRaiz-${{ needs.validate.outputs.version }}.aab
            build/app/outputs/bundle/release/AulaRaiz-${{ needs.validate.outputs.version }}.aab.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - name: Build Windows release
        run: flutter build windows --release
      - name: Build standalone automation agent
        shell: pwsh
        run: |
          dart compile exe bin/aularaiz_agent.dart -o build\windows\x64\runner\Release\aularaiz-agent.exe
          if ($LASTEXITCODE -ne 0) { throw 'Automation agent compilation failed.' }
      - name: Require and import Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) {
            throw 'WINDOWS_CERTIFICATE_PFX_BASE64 is required for a production release.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE_PASSWORD is required for a production release.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'aularaiz-signing.pfx'
          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          )
          "WINDOWS_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Find SignTool
        shell: pwsh
        run: |
          $root = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signTool = Get-ChildItem $root -Filter signtool.exe -Recurse -ErrorAction Stop |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw 'signtool.exe was not found.' }
          "SIGNTOOL_PATH=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Sign Windows executables
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $executables = @(
            'build\windows\x64\runner\Release\aularaiz.exe',
            'build\windows\x64\runner\Release\aularaiz-agent.exe'
          )
          foreach ($executable in $executables) {
            & $env:SIGNTOOL_PATH sign /fd SHA256 /f $env:WINDOWS_PFX_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $executable
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $executable" }
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $sourceDir = (Resolve-Path 'build\windows\x64\runner\Release').Path
          $outputDir = Join-Path $PWD 'build\installer'
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found.' }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" 'windows\installer\AulaRaiz.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Building AulaRaíz installer failed.' }
      - name: Sign and checksum Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $installerName = "AulaRaiz-Setup-$env:APP_VERSION.exe"
          $installer = Join-Path $PWD "build\installer\$installerName"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          & $env:SIGNTOOL_PATH sign /fd SHA256 /f $env:WINDOWS_PFX_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer
          if ($LASTEXITCODE -ne 0) { throw 'Signing AulaRaíz installer failed.' }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content "$installer.sha256" -Encoding ascii
          Remove-Item $env:WINDOWS_PFX_PATH -Force
      - uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: |
            build/installer/AulaRaiz-Setup-${{ needs.validate.outputs.version }}.exe
            build/installer/AulaRaiz-Setup-${{ needs.validate.outputs.version }}.exe.sha256
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [validate, android, windows]
    env:
      GH_TOKEN: ${{ github.token }}
      APP_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "AulaRaíz ${APP_VERSION}" \
              --generate-notes
          fi
