name: Setup hotfix consistency patch

on:
  push:
    branches: [fix/setup-flow-stability]
    paths:
      - '.github/workflows/setup-hotfix-consistency.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/setup-flow-stability
      - name: Align setup labels and regression finder
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'lib/l10n/app_es.arb': [
                  ('"state": "Entidad (opcional)"', '"state": "Entidad federativa"'),
                  ('"municipality": "Municipio (opcional)"', '"municipality": "Municipio"'),
              ],
              'lib/l10n/app_en.arb': [
                  ('"state": "State (optional)"', '"state": "State"'),
                  ('"municipality": "Municipality (optional)"', '"municipality": "Municipality"'),
              ],
              'test/setup_flow_regression_test.dart': [
                  ("find.widgetWithText(TextFormField, 'CCT')", "find.widgetWithText(TextFormField, 'CCT (opcional)')"),
              ],
          }

          for path, pairs in replacements.items():
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old!r}')
                  text = text.replace(old, new, 1)
              file.write_text(text, encoding='utf-8')
      - name: Commit consistency fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/l10n/app_es.arb lib/l10n/app_en.arb test/setup_flow_regression_test.dart
          git commit -m 'fix: align setup labels and regression finder'
          git push origin HEAD:fix/setup-flow-stability
