name: Setup hotfix generator

on:
  push:
    branches: [fix/setup-flow-stability]
    paths:
      - '.github/workflows/setup-hotfix-generate.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/setup-flow-stability
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Generate official offline geography catalog
        run: python tool/generate_mexico_catalog.py
      - name: Defer controller loads until after the first frame
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'lib/features/school_workspace/presentation/school_workspace_screen.dart': (
                  '      context.read<SchoolWorkspaceController>().load();',
                  '''      WidgetsBinding.instance.addPostFrameCallback((_) {
            if (!mounted) return;
            context.read<SchoolWorkspaceController>().load();
          });''',
              ),
              'lib/features/student_roster/presentation/student_roster_screen.dart': (
                  '      context.read<StudentRosterController>().load(widget.group);',
                  '''      WidgetsBinding.instance.addPostFrameCallback((_) {
            if (!mounted) return;
            context.read<StudentRosterController>().load(widget.group);
          });''',
              ),
              'lib/features/attendance/presentation/attendance_screen.dart': (
                  '      context.read<AttendanceController>().load(widget.group);',
                  '''      WidgetsBinding.instance.addPostFrameCallback((_) {
            if (!mounted) return;
            context.read<AttendanceController>().load(widget.group);
          });''',
              ),
              'lib/features/projects/presentation/projects_screen.dart': (
                  '      context.read<ProjectsController>().load(widget.group);',
                  '''      WidgetsBinding.instance.addPostFrameCallback((_) {
            if (!mounted) return;
            context.read<ProjectsController>().load(widget.group);
          });''',
              ),
          }

          for path, (old, new) in replacements.items():
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected lifecycle load not found in {path}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')
      - run: dart format lib/core/catalogs lib/features/school_workspace/presentation/school_workspace_screen.dart lib/features/student_roster/presentation/student_roster_screen.dart lib/features/attendance/presentation/attendance_screen.dart lib/features/projects/presentation/projects_screen.dart
      - name: Commit generated catalog and lifecycle fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/catalogs/mexico_geography_catalog.dart lib/features/school_workspace/presentation/school_workspace_screen.dart lib/features/student_roster/presentation/student_roster_screen.dart lib/features/attendance/presentation/attendance_screen.dart lib/features/projects/presentation/projects_screen.dart
          git commit -m 'fix: stabilize initial screen loading and vendor INEGI geography'
          git push origin HEAD:fix/setup-flow-stability
