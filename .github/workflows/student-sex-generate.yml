name: One-time student sex generation

on:
  push:
    branches: [feat/activity-evaluation-matrix]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/activity-evaluation-matrix
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Patch student sex UI and projections
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected snippet not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          roster = 'lib/features/student_roster/presentation/student_roster_screen.dart'
          replace(
              roster,
              "import 'package:aularaiz/domain/school/teaching_group.dart';\n",
              "import 'package:aularaiz/domain/school/teaching_group.dart';\nimport 'package:aularaiz/domain/student/student_sex.dart';\n",
          )
          replace(
              roster,
              "      secondSurname: draft.secondSurname,\n      birthDate: draft.birthDate,",
              "      secondSurname: draft.secondSurname,\n      sex: draft.sex,\n      birthDate: draft.birthDate,",
          )
          replace(
              roster,
              "  DateTime? _birthDate;\n  bool _dirty = false;",
              "  DateTime? _birthDate;\n  StudentSex? _sex;\n  bool _dirty = false;",
          )
          replace(
              roster,
              "    _birthDate = entry?.student.birthDate;\n  }",
              "    _birthDate = entry?.student.birthDate;\n    _sex = entry?.student.sex;\n  }",
          )
          replace(
              roster,
              "                  if (!widget.identityOnly) ...[\n",
              "                  const SizedBox(height: 12),\n                  DropdownButtonFormField<StudentSex>(\n                    initialValue: _sex,\n                    isExpanded: true,\n                    decoration: InputDecoration(\n                      labelText: _studentSexFieldLabel(context),\n                    ),\n                    hint: Text(_studentSexUnspecifiedLabel(context)),\n                    items: [\n                      for (final sex in StudentSex.values)\n                        DropdownMenuItem(\n                          value: sex,\n                          child: Text(_studentSexLabel(context, sex)),\n                        ),\n                    ],\n                    onChanged: (value) {\n                      setState(() {\n                        _sex = value;\n                        _dirty = true;\n                      });\n                    },\n                  ),\n                  if (!widget.identityOnly) ...[\n",
          )
          replace(
              roster,
              "        secondSurname: _secondSurnameController.text,\n        birthDate: _birthDate,",
              "        secondSurname: _secondSurnameController.text,\n        sex: _sex,\n        birthDate: _birthDate,",
          )
          replace(
              roster,
              "    required this.secondSurname,\n    required this.birthDate,",
              "    required this.secondSurname,\n    required this.sex,\n    required this.birthDate,",
          )
          replace(
              roster,
              "  final String secondSurname;\n  final DateTime? birthDate;",
              "  final String secondSurname;\n  final StudentSex? sex;\n  final DateTime? birthDate;",
          )
          replace(
              roster,
              "String _gradeLabel(PrimaryGrade grade, AppLocalizations l10n) {",
              "String _studentSexFieldLabel(BuildContext context) =>\n    Localizations.localeOf(context).languageCode == 'en' ? 'Sex' : 'Sexo';\n\nString _studentSexUnspecifiedLabel(BuildContext context) =>\n    Localizations.localeOf(context).languageCode == 'en'\n    ? 'Not specified'\n    : 'Sin especificar';\n\nString _studentSexLabel(BuildContext context, StudentSex sex) {\n  final english = Localizations.localeOf(context).languageCode == 'en';\n  return switch (sex) {\n    StudentSex.male => english ? 'Male' : 'Masculino',\n    StudentSex.female => english ? 'Female' : 'Femenino',\n  };\n}\n\nString _gradeLabel(PrimaryGrade grade, AppLocalizations l10n) {",
          )

          import_screen = 'lib/features/student_import/presentation/student_import_screen.dart'
          replace(
              import_screen,
              "                    if (draft.birthDateText.trim().isNotEmpty) ...[",
              "                    if (draft.sexText.trim().isNotEmpty) ...[\n                      const SizedBox(height: 3),\n                      Text(\n                        '${l10n.importFieldLabel(StudentImportField.sex)}: '\n                        '${draft.sexText}',\n                      ),\n                    ],\n                    if (draft.birthDateText.trim().isNotEmpty) ...[",
          )
          replace(
              import_screen,
              "  late final TextEditingController _secondSurname;\n  late final TextEditingController _birthDate;",
              "  late final TextEditingController _secondSurname;\n  late final TextEditingController _sex;\n  late final TextEditingController _birthDate;",
          )
          replace(
              import_screen,
              "    _secondSurname = TextEditingController(text: draft.secondSurname);\n    _birthDate = TextEditingController(text: draft.birthDateText);",
              "    _secondSurname = TextEditingController(text: draft.secondSurname);\n    _sex = TextEditingController(text: draft.sexText);\n    _birthDate = TextEditingController(text: draft.birthDateText);",
          )
          replace(
              import_screen,
              "    _secondSurname.dispose();\n    _birthDate.dispose();",
              "    _secondSurname.dispose();\n    _sex.dispose();\n    _birthDate.dispose();",
          )
          replace(
              import_screen,
              "              const SizedBox(height: 12),\n              TextField(\n                controller: _birthDate,",
              "              const SizedBox(height: 12),\n              TextField(\n                controller: _sex,\n                decoration: InputDecoration(\n                  labelText: l10n.importFieldLabel(StudentImportField.sex),\n                  hintText: 'Masculino / Femenino',\n                ),\n              ),\n              const SizedBox(height: 12),\n              TextField(\n                controller: _birthDate,",
          )
          replace(
              import_screen,
              "                secondSurname: _secondSurname.text,\n                birthDateText: _birthDate.text,",
              "                secondSurname: _secondSurname.text,\n                sexText: _sex.text,\n                birthDateText: _birthDate.text,",
          )

          projection = 'lib/application/reports/report_projection_builder.dart'
          replace(
              projection,
              "      grade: enrollment.grade,\n      attendance: AttendanceReportSummary(",
              "      grade: enrollment.grade,\n      sex: student.sex,\n      attendance: AttendanceReportSummary(",
          )
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: dart format bin lib test integration_test
      - name: Export Drift schema v4
        run: dart run drift_dev schema dump lib/data/local/app_database.dart drift_schemas/app_database/
      - name: Commit generated artifacts
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin lib test integration_test drift_schemas
          git commit -m "feat: complete student sex support"
          git push origin HEAD:feat/activity-evaluation-matrix
