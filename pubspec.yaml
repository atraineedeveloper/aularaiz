name: aularaiz
description: AulaRaíz — gestión docente offline-first para la Nueva Escuela Mexicana.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  csv: ^8.0.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  excel: ^4.0.6
  file_selector: ^1.1.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  path_provider: ^2.1.6
  pdf: 3.12.0
  printing: 5.14.3
  provider: ^6.1.5+1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
