name: aularaiz
description: AulaRaíz — gestión docente offline-first para la Nueva Escuela Mexicana.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  go_router: ^17.5.0
  intl: ^0.20.3
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.15.1
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
